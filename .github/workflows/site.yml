name: Website checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check Astro
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Audit SEO and AEO output
        run: npm run audit:seo
      - name: Audit link-preview cards
        run: npm run audit:og
